name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      # hard tier: build freshness, contract drift, host/client smoke tests
      - run: pnpm verify
      # plain-JS tooling surface (scripts/, .verify/)
      - run: pnpm lint
